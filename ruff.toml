target-version = "py312"
line-length = 100
exclude = [
    ".git",
    ".idea",
    ".pytest_cache",
    "__pycache__",
    "venv",
    ".venv",
    "*/migrations/*",
]

[lint]
select = ["E", "W", "F", "I", "B", "C4", "DJ", "UP"]
ignore = ["E501", "B008", "DJ001"]

[lint.per-file-ignores]
"config/settings.py" = ["F405", "F403"]
"tests/*" = ["S101"]

[format]
quote-style = "double"
indent-style = "space"
line-ending = "auto"
