<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}TB4 — Авторизация по телефону{% endblock %}</title>
    <style>
        * { box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background: #f4f5f7;
            color: #1f2937;
            margin: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px;
        }
        .card {
            background: #fff;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0,0,0,.08);
            padding: 32px;
            width: 100%;
            max-width: 480px;
        }
        h1 { font-size: 22px; margin: 0 0 8px; }
        .muted { color: #6b7280; font-size: 14px; margin: 0 0 24px; }
        label { display: block; font-size: 13px; color: #374151; margin-bottom: 6px; }
        input[type=text], input[type=tel] {
            width: 100%;
            padding: 12px 14px;
            border: 1px solid #d1d5db;
            border-radius: 8px;
            font-size: 15px;
            margin-bottom: 16px;
        }
        input:focus { outline: none; border-color: #2563eb; box-shadow: 0 0 0 3px rgba(37,99,235,.15); }
        button, .btn {
            display: inline-block;
            padding: 12px 18px;
            background: #2563eb;
            color: #fff;
            border: none;
            border-radius: 8px;
            font-size: 15px;
            cursor: pointer;
            text-decoration: none;
            text-align: center;
        }
        button:hover, .btn:hover { background: #1d4ed8; }
        .btn-secondary { background: #6b7280; }
        .btn-secondary:hover { background: #4b5563; }
        .btn-block { width: 100%; }
        .error { background: #fee2e2; color: #b91c1c; padding: 10px 14px; border-radius: 8px; margin-bottom: 16px; font-size: 14px; }
        .success { background: #dcfce7; color: #166534; padding: 10px 14px; border-radius: 8px; margin-bottom: 16px; font-size: 14px; }
        .code { font-family: ui-monospace, "SF Mono", Menlo, monospace; background: #f3f4f6; padding: 12px 16px; border-radius: 8px; font-size: 15px; display: inline-block; letter-spacing: 2px; }
        .row { display: flex; gap: 12px; align-items: center; margin-bottom: 12px; }
        .row label { margin: 0; }
        ul { padding-left: 0; list-style: none; margin: 0; }
        ul li { padding: 10px 14px; background: #f9fafb; border-radius: 8px; margin-bottom: 8px; font-family: ui-monospace, Menlo, monospace; font-size: 14px; }
        .actions { margin-top: 24px; display: flex; gap: 8px; }
    </style>
</head>
<body>
    <div class="card">
        {% if messages %}
            {% for message in messages %}
                <div class="{{ message.tags }}">{{ message }}</div>
            {% endfor %}
        {% endif %}
        {% block content %}{% endblock %}
    </div>
</body>
</html>
