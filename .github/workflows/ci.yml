name: CI

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master, develop]

jobs:
  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install ruff==0.4.4
      - run: ruff check .
      - run: ruff format --check .

  test:
    name: Tests (pytest)
    runs-on: ubuntu-latest
    needs: lint

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: tb4_db
          POSTGRES_USER: tb4_user
          POSTGRES_PASSWORD: tb4_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U tb4_user -d tb4_db"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DJANGO_SECRET_KEY: ci-secret-key-not-for-production
      DJANGO_DEBUG: "True"
      DJANGO_ALLOWED_HOSTS: localhost,127.0.0.1
      POSTGRES_DB: tb4_db
      POSTGRES_USER: tb4_user
      POSTGRES_PASSWORD: tb4_password
      POSTGRES_HOST: localhost
      POSTGRES_PORT: "5432"
      JWT_ACCESS_LIFETIME_MINUTES: "15"
      JWT_REFRESH_LIFETIME_DAYS: "7"
      SMS_CODE_TTL_SECONDS: "300"
      SMS_CODE_LENGTH: "4"
      SMS_CODE_MAX_ATTEMPTS: "5"
      SMS_PROVIDER: mock

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Run tests
        run: pytest -v --cov=users --cov-report=term-missing
